services:
  web:
    build:
      context: .
      args:
        VITE_KAKAO_CLIENT_ID: ${VITE_KAKAO_CLIENT_ID}
        VITE_KAKAO_REDIRECT_URI: ${VITE_KAKAO_REDIRECT_URI}
        VITE_TOSS_CLIENT_KEY: ${VITE_TOSS_CLIENT_KEY}
    container_name: ignoa-web
    platform: linux/arm64
    ports:
      - "35173:80"
    restart: unless-stopped
